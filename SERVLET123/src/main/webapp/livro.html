<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Criar livro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="Imagem/sigma.png">
</head>
<body>
    <form name="FormularioLivro" action="criar">
        <table>
            <tr>
                <td><input type="text" name="Titulo" placeholder="nome"></td>
            </tr>

            <tr>
                <td><input type="text" name="autor" placeholder="nomeautor"></td>
            </tr>

            <tr>
                <td><input type="text" name="isbn" placeholder="codigoisbn"></td>
            </tr>
        </table>
        <input type="button" class="adicionar" value="Adicionar">
    </form>

</body>
</html>
