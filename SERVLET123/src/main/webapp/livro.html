<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Criar livro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="Imagem/sigma.png">
</head>
<body>
    <h1>Criar novo livro </h1>
    <form name="FormularioLivro" action="criarLivro">
        <table>
            <tr>
                <td><input type="text" name="titulo" placeholder="nome" class="Botao1"></td>
            </tr>

            <tr>
                <td><input type="text" name="autor" placeholder="nome do autor" class="Botao1"></td>
            </tr>

            <tr>
                <td><input type="text" name="isbn" placeholder="codigo isbn (13 Digitos)" class="Botao1"></td>
            </tr>

            <tr>
                <td><input type="text" name="ano_publicacao" placeholder="ano publicacao" class="Botao1"></td>
            </tr>

            <tr>
                <td><input type="text" name="disponivel" placeholder="disponível(S / N)" class="Botao1"></td>
            </tr>
        </table>
        <input type="button" class="adicionar" value="Adicionar" onclick="validar()">
    </form>
<script src="Validadores/validadorFormulario.js"></script>
</body>
</html>
